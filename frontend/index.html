<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bangkok Condo Price Predictor</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; max-width: 600px; margin: auto; }
    h1 { color: #333; text-align: center; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input, select { width: 100%; padding: 0.5rem; margin-top: 0.5rem; border-radius: 4px; border: 1px solid #ccc; }
    button { margin-top: 1.5rem; padding: 0.7rem 1.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 2rem; font-size: 1.2rem; color: green; text-align: center; }
  </style>
</head>
<body>
  <h1>Bangkok Condo Price Predictor</h1>

  <label>Area (sq.ft.):</label>
  <input type="number" id="area" min="1" step="0.1">

  <label>Bedrooms:</label>
  <input type="number" id="bedroom" min="1">

  <label>Bathrooms:</label>
  <input type="number" id="bathroom" min="1">

  <label>Property Type:</label>
  <select id="type">
    <option value="Apartment">Apartment</option>
    <option value="Condo">Condo</option>
    <option value="House">House</option>
  </select>

  <button onclick="predict()">Predict Price</button>

  <div id="result"></div>

  <script>
    async function predict() {
      const payload = {
        area_sqft: parseFloat(document.getElementById('area').value),
        no_bedroom: parseInt(document.getElementById('bedroom').value),
        no_bathroom: parseInt(document.getElementById('bathroom').value),
        property_type: document.getElementById('type').value
      };

      try {
        const response = await fetch('https://condo-api-predicted.onrender.com/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        document.getElementById('result').innerText = `Predicted Price: ${result.predicted_price_thb} THB`;
      } catch (error) {
        document.getElementById('result').innerText = 'Error: Unable to fetch prediction';
      }
    }
  </script>
</body>
</html>
